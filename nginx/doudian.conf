# ==============================================================================
# DouDian - Nginx 反向代理配置示例
#
# 用法:
#   cp nginx/doudian.conf /etc/nginx/conf.d/
#   nginx -t && systemctl reload nginx
#
# SSL 配置请使用: certbot --nginx -d your-domain.com
# ==============================================================================

# HTTP -> HTTPS 重定向（启用 SSL 后取消注释）
# server {
#     listen 80;
#     server_name doudian.example.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    # listen 443 ssl;  # 启用 SSL 后取消注释
    server_name _;  # 替换为你的域名: doudian.example.com

    # SSL 证书（使用 certbot 申请后自动配置）
    # ssl_certificate /etc/letsencrypt/live/doudian.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/doudian.example.com/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;

    # 上传文件大小限制 (CSV 导入)
    client_max_body_size 16M;

    # 反向代理到 DouDian 后端
    location / {
        proxy_pass http://127.0.0.1:2095;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # WebSocket 支持（预留）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 静态文件直接由 Nginx 处理（性能更好）
    location /static/ {
        alias /opt/doudian/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 访问日志
    access_log /var/log/nginx/doudian_access.log;
    error_log /var/log/nginx/doudian_error.log;
}
